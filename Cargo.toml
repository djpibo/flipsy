[package]
name = "flipsy"
version = "0.2.0"
edition = "2021"
description = "Ultra-lightweight Pure Rust Oracle Client & XPlan Visualizer"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
